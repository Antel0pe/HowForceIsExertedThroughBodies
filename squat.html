<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Squat Lab · Muscle Force Explorer</title>
  <link rel="stylesheet" href="./src/style.css" />
  <link rel="stylesheet" href="./src/squat.css" />
</head>
<body>
  <div id="app">
    <aside id="left">
      <header>
        <a class="navlink" href="./">← Muscle Explorer</a>
        <h1>Squat Lab</h1>
      </header>
      <div id="variants"></div>
      <div id="leftScroll">
        <ol id="steps"></ol>
        <div id="notes"></div>
      </div>
    </aside>

    <main id="viewport">
      <div id="phase"></div>
      <div id="views">
        <button data-view="three">¾</button>
        <button data-view="front">Front</button>
        <button data-view="side">Side</button>
        <button data-view="back">Back</button>
      </div>
      <svg id="zoomLink"><line/><circle r="16"/></svg>
      <div id="spine"></div>
      <div id="knee"></div>
      <div id="labels"></div>
      <div id="tooltip"></div>
      <div id="toolbar">
        <div id="playbar">
          <button id="play" title="Pause (Space)">❚❚</button>
          <input id="scrub" type="range" min="0" max="1000" value="0" title="Scrub" />
          <select id="speed" title="Playback speed">
            <option value="0.5">0.5×</option>
            <option value="0.75">0.75×</option>
            <option value="1" selected>1×</option>
            <option value="1.5">1.5×</option>
          </select>
        </div>
        <div id="toggles">
          <label><input type="checkbox" id="tSkel" checked />Skeleton</label>
          <label class="thr-ctl" title="Muscles glow only when working above this level">Glow above <input type="range" id="tThr" min="0" max="80" value="35" /><b id="tThrVal">35%</b></label>
          <label title="Fade muscles that are not glowing"><input type="checkbox" id="tFade" checked />Fade the rest</label>
          <label title="Load on knee, hip and lower back"><input type="checkbox" id="tLoads" />Joint loads</label>
          <label title="Hip–knee–ankle and torso lines"><input type="checkbox" id="tAlign" />Lines</label>
          <label title="Centre of mass over the feet"><input type="checkbox" id="tBalance" />Balance</label>
        </div>
      </div>
    </main>

    <aside id="right">
      <div id="rightScroll">
        <div id="picked"></div>
        <h3 class="sec">How hard each muscle works</h3>
        <div class="emg-legend">
          <span><i class="m con"></i>shortening</span>
          <span><i class="m ecc"></i>lengthening</span>
          <span><i class="m iso"></i>holding</span>
          <span id="tickLegend"><i class="tickSw"></i>proper form</span>
        </div>
        <div id="emg"></div>
        <p class="fine">Simulated, not measured.</p>
      </div>
    </aside>
  </div>
  <script type="module" src="./src/squat.js"></script>
</body>
</html>
