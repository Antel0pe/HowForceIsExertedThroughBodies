<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Muscle Force Explorer</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body data-page="explorer">
  <div id="app">
    <aside id="left">
      <header>
        <h1>Muscle Force Explorer</h1>
        <p>How each muscle pulls, what it moves, and how it is triggered.</p>
      </header>
      <input id="search" type="search" placeholder="Search muscles or activities (e.g. &quot;pull-up&quot;)" autocomplete="off" />
      <nav id="list"></nav>
    </aside>

    <main id="viewport">
      <div id="views">
        <button data-view="front">Front</button>
        <button data-view="back">Back</button>
        <button data-view="right" title="View the body's right side">Right</button>
        <button data-view="left" title="View the body's left side">Left</button>
      </div>
      <div id="labels"></div>
      <div id="tooltip"></div>
      <div id="toolbar">
        <div id="playbar" class="disabled">
          <button id="play" title="Pause (Space)">❚❚</button>
          <input id="scrub" type="range" min="0" max="1000" value="0" title="Scrub the contraction" />
          <select id="speed" title="Playback speed">
            <option value="0.5">0.5×</option>
            <option value="1" selected>1×</option>
            <option value="2">2×</option>
          </select>
        </div>
        <div id="toggles">
          <label><input type="checkbox" id="tSup" />Superficial</label>
          <label><input type="checkbox" id="tDeep" />Deep</label>
          <label><input type="checkbox" id="tSkel" />Skeleton</label>
          <label title="Fade muscles not involved in the movement"><input type="checkbox" id="tGhost" />Fade others</label>
          <label><input type="checkbox" id="tForce" />Forces</label>
          <label><input type="checkbox" id="tNerve" />Nerve</label>
        </div>
      </div>
    </main>

    <aside id="right">
      <div id="info"></div>
    </aside>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
